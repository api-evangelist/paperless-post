source: live GET of /.well-known/* on every Paperless Post host
note: >-
  The primary consumer site (www.paperlesspost.com) publishes no /.well-known/
  discovery surface at all — every path returns an S3 NoSuchKey 404. The entire
  machine-readable discovery surface on a paperlesspost.com host lives on
  partyshop.paperlesspost.com, the Paperless Post Party Shop storefront, which
  is Shopify-hosted and therefore ships Shopify's UCP + OAuth/OIDC discovery
  documents. The security.txt found on status.paperlesspost.com is Atlassian
  Statuspage's vendor document (Canonical points at atlassian.com), NOT a
  Paperless Post vulnerability-disclosure program — it is recorded here for
  evidence and deliberately NOT wired as a SecurityTxt or Security pointer.
