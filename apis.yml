apis:
- aid: paperless-post:party-shop
  name: Paperless Post Party Shop Agent Commerce Surface
  description: 'The Paperless Post Party Shop storefront is the only machine-callable
    surface on any paperlesspost.com host. It is Shopify-hosted and implements the
    Universal Commerce Protocol (UCP) for agent-driven commerce: a UCP merchant
    profile at /.well-known/ucp, an MCP endpoint at /api/ucp/mcp carrying the
    search_catalog / create_cart / create_checkout / update_checkout /
    complete_checkout tool set, OAuth 2.0 + OpenID Connect customer-account
    authorization, published agent instructions at /llms.txt and /agents.md, and
    anonymous read-only product and collection JSON endpoints. Checkout completion
    requires contemporaneous buyer approval.'
  humanURL: https://partyshop.paperlesspost.com/agents.md
  baseURL: https://partyshop.paperlesspost.com
