x-coverage:
  state: covered
  reason: agent-commerce-surface-only
  detail: >-
    The core Paperless Post invitation product at www.paperlesspost.com has no
    developer program and no machine-readable contract — every OpenAPI, GraphQL,
    agent-card and /.well-known probe 404s — but the Party Shop storefront at
    partyshop.paperlesspost.com serves a full UCP/MCP agent-commerce surface
    (llms.txt, agents.md, /.well-known/ucp, OAuth/OIDC discovery), so the
    provider is covered on that surface rather than empty.
