aid: paperless-post
name: Paperless Post
description: 'Paperless Post is a New York City based digital and print stationery
  company whose platform lets people design, send, and manage online invitations,
  greeting cards, save-the-dates, and free Flyers for weddings, birthdays, holidays,
  business events, and other occasions. Founded in 2008 by siblings James and Alexa
  Hirschfeld, it pairs an in-house design studio with licensed designer collections
  (Oscar de la Renta, Rifle Paper Co., Marimekko and others) and adds RSVP tracking,
  guest messaging, event websites, mobile apps, and a Party Shop. Paperless Post
  publishes no public developer program, API reference, or machine-readable specification;
  the /api/v1 endpoints named in its robots.txt serve its own first-party web and
  mobile clients only.'
